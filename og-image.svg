  <text x="80" y="270" font-family="system-ui, sans-serif" font-size="56" fill="#E8E6E1" font-weight="700">Jun Wen Leong</text>
  <text x="80" y="340" font-family="system-ui, sans-serif" font-size="24" fill="#9CA3AF">Adversarial evaluation. Jailbreak robustness. Red-teaming.</text>
