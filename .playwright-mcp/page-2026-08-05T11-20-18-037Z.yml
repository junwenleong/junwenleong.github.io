        - generic [ref=e65]: WEAKENED
        - heading "Cause of Death" [level=4] [ref=e66]
        - paragraph [ref=e67]: 55% defeat rate within-family, n=20. Joint GCG optimization against canary + target simultaneously breaks the disagreement signal.
        - heading "Evidence" [level=4] [ref=e68]
        - paragraph [ref=e69]: Cross-family still holds (exponential penalty). Within-family is the vulnerability. The geometric bound assumed attacker lacks cross-family access — violated when attacker has white-box to both.
        - heading "Lesson" [level=4] [ref=e70]
        - paragraph [ref=e71]: Diversity is the moat, not disagreement itself. Same-family canaries are decorative.
