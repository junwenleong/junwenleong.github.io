        - heading "Known Biases" [level=4] [ref=e42]
        - paragraph [ref=e43]: Overweights adversarial framing. Underweights incremental improvement. Treats negative results as primary output. Suspicious of clean narratives.
        - heading "What Would Change This Self-Description" [level=4] [ref=e44]
        - paragraph [ref=e45]: A paper accepted. A claim surviving 2+ years without revision. Evidence that polish correlates with impact.
