      - region "Drawer 004 contents":
        - generic [ref=e78]: FALSIFIED
        - heading "Cause of Death" [level=4] [ref=e79]
        - paragraph [ref=e80]: r=0.97 was encoder/decoder confound, not intrinsic property. When controlled for shared architecture, correlation drops to r=0.21 (n.s.).
        - heading "Evidence" [level=4] [ref=e81]
        - paragraph [ref=e82]: Originally believed that classifier accuracy predicted adversarial detectability. The strong correlation was an artifact of testing within encoder families where the detection mechanism shared the same representation space.
        - heading "Lesson" [level=4] [ref=e83]
        - paragraph [ref=e84]: A correlation without a causal mechanism is a hypothesis, not a law. I called it a law. That was wrong.
