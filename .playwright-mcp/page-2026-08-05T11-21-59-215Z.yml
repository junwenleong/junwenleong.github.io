        - heading "Stats" [level=4] [ref=f6e40]
        - paragraph [ref=f6e41]: 28k+ runs · 3 papers · 35+ models · 0 errors
        - heading "Known Biases" [level=4] [ref=f6e42]
        - paragraph [ref=f6e43]: Overweights adversarial framing. Underweights incremental improvement. Treats negative results as primary output. Suspicious of clean narratives.
        - heading "What Would Change This Self-Description" [level=4] [ref=f6e44]
        - paragraph [ref=f6e45]: A paper accepted. A claim surviving 2+ years without revision. Evidence that polish correlates with impact.
