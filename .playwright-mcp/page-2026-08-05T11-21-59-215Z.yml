      - region "Drawer 003 contents":
        - generic [ref=f6e65]: WEAKENED
        - heading "Cause of Death" [level=4] [ref=f6e66]
        - paragraph [ref=f6e67]: 55% defeat rate within-family, n=20. Joint GCG optimization against canary + target simultaneously breaks the disagreement signal.
        - heading "Evidence" [level=4] [ref=f6e68]
        - paragraph [ref=f6e69]: Cross-family still holds (exponential penalty). Within-family is the vulnerability. The geometric bound assumed attacker lacks cross-family access — violated when attacker has white-box to both.
        - heading "Lesson" [level=4] [ref=f6e70]
        - paragraph [ref=f6e71]: Diversity is the moat, not disagreement itself. Same-family canaries are decorative.
