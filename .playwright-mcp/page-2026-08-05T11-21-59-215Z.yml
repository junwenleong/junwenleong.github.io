        - generic [ref=f6e49]: Standard defenses hold against injection
        - generic [ref=f6e51]: 2026-05-14
      - region "Drawer 002 contents":
        - generic [ref=f6e52]: BROKEN
        - heading "Cause of Death" [level=4] [ref=f6e53]
        - paragraph [ref=f6e54]: 95% ASR under compliance framing, N=5,040. Six of seven standard defenses defeated by delayed-trigger attacks on stateful LLM agents.
        - heading "Evidence" [level=4] [ref=f6e55]
        - paragraph [ref=f6e56]: "Pre-registered factorial: 9 models × 7 defenses × 80 scenarios. Only system-prompt-locked agents survived (and only when the lock was architecturally enforced, not prompt-based)."
        - heading "Lesson" [level=4] [ref=f6e57]
        - paragraph [ref=f6e58]: Prompt-level defense is not defense. It is a suggestion the model can be convinced to override.
